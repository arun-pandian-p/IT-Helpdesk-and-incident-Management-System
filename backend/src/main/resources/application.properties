# Server Configuration
server.port=${PORT:8000}

# Application
spring.application.name=service-desk-backend

# SQLite Datasource Configuration
# Database path can be overridden via DB_PATH env var or sqlite.db.path property
spring.datasource.url=jdbc:sqlite:${DB_PATH:helpdesk.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite Connection Pool and Transaction Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# SQLite pragma initialization on connection
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL; PRAGMA busy_timeout = 5000;

# JWT Security Settings
app.jwt.secret=${JWT_SECRET:super-secret-production-key-change-in-env-9284729184-spring-boot-jwt-token-key}
app.jwt.expiration-minutes=1440

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:8000,http://localhost:80

# SLA Default Targets (hours)
app.sla.critical-hours=4
app.sla.high-hours=24
app.sla.medium-hours=48
app.sla.low-hours=72
