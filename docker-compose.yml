services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    restart: unless-stopped
    environment:
      DB_PATH: /data/helpdesk.db
      PORT: 8000
      JWT_SECRET: super-production-jwt-secret-replace-in-env-9823412
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - helpdesk_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helpdesk_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  helpdesk_data:
